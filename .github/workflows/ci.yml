name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'

jobs:
  # Job 1: Lint and Code Quality Check
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies - Backend
        working-directory: ./backend
        run: npm ci
      
      - name: Install dependencies - Frontend
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint - Backend
        working-directory: ./backend
        run: npm run lint --if-present || echo "No lint script found"
      
      - name: Run ESLint - Frontend
        working-directory: ./frontend
        run: npm run lint --if-present || echo "No lint script found"
      
      - name: Check code formatting - Backend
        working-directory: ./backend
        run: npm run format:check --if-present || npx prettier --check "src/**/*.{ts,tsx,js,jsx,json}" || echo "Formatting check skipped"
      
      - name: Check code formatting - Frontend
        working-directory: ./frontend
        run: npm run format:check --if-present || npx prettier --check "src/**/*.{ts,tsx,js,jsx,json}" || echo "Formatting check skipped"

  # Job 2: Build Backend
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
      
      - name: Build TypeScript
        working-directory: ./backend
        run: npm run build
      
      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 7

  # Job 3: Build Frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build
      
      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Job 4: Security Audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Run npm audit - Backend
        working-directory: ./backend
        run: npm audit --audit-level=moderate || true
      
      - name: Run npm audit - Frontend
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true

  # Job 5: Type Check
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies - Backend
        working-directory: ./backend
        run: npm ci
      
      - name: Install dependencies - Frontend
        working-directory: ./frontend
        run: npm ci
      
      - name: Type check - Backend
        working-directory: ./backend
        run: npx tsc --noEmit
      
      - name: Type check - Frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

  # Job 6: Deploy Status Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, type-check, security-audit]
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "::notice::Build completed successfully!"
          echo "Backend Build: ${{ needs.build-backend.result }}"
          echo "Frontend Build: ${{ needs.build-frontend.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "Security Audit: ${{ needs.security-audit.result }}"
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
            ## 🚀 Build Summary
            
            | Job | Status |
            |-----|--------|
            | Backend Build | ${{ needs.build-backend.result == 'success' ? '✅' : '❌' }} |
            | Frontend Build | ${{ needs.build-frontend.result == 'success' ? '✅' : '❌' }} |
            | Type Check | ${{ needs.type-check.result == 'success' ? '✅' : '❌' }} |
            | Security Audit | ${{ needs.security-audit.result == 'success' ? '✅' : '❌' }} |
            
            **Commit:** ${context.sha.substring(0, 7)}
            **Branch:** ${context.ref}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
